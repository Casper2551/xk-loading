<!DOCTYPE html>
<html lang="en">
    <head>

        <!-- meta tags -->
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- css tags -->
        <link href="html/style.css" rel="stylesheet" type="text/css" />
        
        <!-- JQuery tags -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- js tags -->
        <script src="html/app.js" type="text/javascript"></script>
        <script src="html/music.js"></script>

    
</head>

<body>
    <div class="video-background">
    <div class="overlay"></div>
    <video id="video" autoplay muted loop>
    <source src="assets/changethisvideo.mp4" type="video/mp4" /> <!-- change name to your video in assets folder -->
        Your Browser does not support the video element
    </video>
    </div>

    <audio id="audio-files" src="assets/music.mp3" autoplay="true"></audio>

    <img class="logo" src="assets/changethislogo.svg"></img> <!-- change name to your logo in assets folder -->

    <h1 class="print"><strong>Change this in ui.html/line: 36</strong></h1>

    <!-- comment if you don't want loading bar -->

    <div class="guide">
        <strong>Guide:</strong><br>
        Use the Up and Down arrow keys to adjust the volume.<br>
        Press the Spacebar to mute/unmute the music.
    </div>
